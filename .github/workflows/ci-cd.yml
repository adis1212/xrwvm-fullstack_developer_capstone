name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -r server/requirements.txt

    - name: Run flake8 Python linter
      run: |
        flake8 server/djangoapp --count --select=E9,F63,F7,F82 --show-source --statistics
        python -m py_compile server/djangoapp/views.py
        python -m py_compile server/djangoapp/urls.py
        python -m py_compile server/djangoapp/models.py
        python -m py_compile server/djangoapp/restapis.py
        cd server && python manage.py check

  node-lint:
    name: Node.js Lint and Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: |
        cd server/frontend
        npm install

    - name: Build and lint frontend
      run: |
        cd server/frontend
        CI=false npm run build
